<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Pay</title>
  <meta name="theme-color" content="#3b3fd6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Pay">
  <style>
    :root { --grad: linear-gradient(135deg, #6c5ce7, #2563eb 60%, #14b8a6 140%); --ink: #181d3a; --muted: #6a7392; --line: #e3e8f1; --paper: #f2f4fb; }
    * { box-sizing: border-box; } html, body { margin: 0; min-height: 100%; } body { font-family: Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom); }
    .hidden { display: none !important; } .muted { color: var(--muted); } .small { font-size: 12.5px; } .right { text-align: right; } .row { display: flex; align-items: center; gap: 10px; } .grow { flex: 1; }
    .top { background: var(--grad); color: #fff; padding: calc(18px + env(safe-area-inset-top)) 18px 54px; } .top h1 { margin: 0; font-size: 20px; } .top .sub { opacity: .85; font-size: 13px; margin-top: 2px; }
    .wrap { max-width: 560px; margin: -38px auto 0; padding: 0 14px 90px; }
    .card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 8px 28px rgba(27,31,75,.1); margin-bottom: 12px; }
    .big { font-size: 34px; font-weight: 800; letter-spacing: -.02em; } .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: #ece9ff; color: #4a3fc4; } .pill.ok { background: #d9f5e8; color: #0b7a4b; } .pill.est { background: #fdecc8; color: #9a5b00; }
    .day { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #eef1f7; } .day:last-child { border: 0; } .day .d { width: 46px; text-align: center; } .day .d b { display: block; font-size: 17px; } .day .d span { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .bar { height: 7px; background: #eef1f7; border-radius: 4px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--grad); }
    nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 10; } nav.tabs button { flex: 1; border: 0; background: none; padding: 12px 4px 10px; font: inherit; font-size: 12px; font-weight: 700; color: var(--muted); } nav.tabs button.on { color: #4a3fc4; }
    input { width: 100%; padding: 12px 13px; border: 1px solid var(--line); border-radius: 10px; font: inherit; } label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 12px 0 5px; }
    .btn { border: 0; border-radius: 12px; padding: 13px 16px; font: inherit; font-weight: 700; background: var(--grad); color: #fff; width: 100%; cursor: pointer; } .btn.ghost { background: #eef1fb; color: #4a3fc4; } .btn.sm { width: auto; padding: 8px 12px; font-size: 13px; }
    .notice { background: #fdecc8; color: #7a5200; padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; } .notice.err { background: #fde2e2; color: #c0262d; } .notice.ok { background: #d9f5e8; color: #0b7a4b; }
    .auth { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--grad); } .auth .box { background: #fff; width: 100%; max-width: 380px; border-radius: 20px; padding: 26px; }
    table.p { width: 100%; border-collapse: collapse; font-size: 14px; } table.p td { padding: 8px 0; border-bottom: 1px solid #eef1f7; } table.p td:last-child { text-align: right; font-variant-numeric: tabular-nums; } table.p tr.t td { font-weight: 800; font-size: 16px; border-bottom: 0; }
    @media print { .top, nav.tabs, .noprint { display: none !important; } .wrap { margin: 0; } .card { box-shadow: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="employee.js"></script>
</body>
</html>
