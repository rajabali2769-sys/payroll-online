<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payroll Online · Crystal FM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310233b'/%3E%3Cpath d='M9 21l4-6 4 3 6-9' fill='none' stroke='%2312a3a1' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
  <script>
    // Payroll Online loader: before starting, re-download every code file so an old saved copy in the browser
    // can never be mixed with the new files (that mix caused "does not provide an export named ..." errors).
    window.__BUILD = '4.3';
    (function () {
      var FILES = ['adhoc.js', 'api.js', 'app.js', 'attendance.js', 'budgets.js', 'calc.js', 'calendar.js', 'chase.js', 'chatbot.js', 'ctx.js', 'customise.js', 'dashboard.js', 'escalate.js', 'explorer.js', 'history.js', 'hours.js', 'imports.js', 'journal.js', 'leave.js', 'line-drawer.js', 'mail.js', 'parsers.js', 'payroll.js', 'payrolls.js', 'payslips.js', 'people.js', 'projects.js', 'settings.js', 'timesheet.js', 'timesheets.js', 'ui.js', 'users.js', 'widgets.js', 'xlsx.js', 'config.js', 'style.css'];
      var css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'style.css?v=' + window.__BUILD; document.head.appendChild(css);
      var go = function () { var s = document.createElement('script'); s.type = 'module'; s.src = 'app.js'; document.body.appendChild(s); };
      var refresh = function (f) { return fetch(f, { cache: 'reload' }).catch(function () {}); };
      Promise.all(FILES.filter(function (f) { return f !== 'style.css'; }).map(refresh)).then(go, go);
    })();
  </script>
</body>
</html>
